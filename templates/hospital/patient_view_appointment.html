<div class="container">
  <div class="panel panel-primary">
    <div class="panel-heading">
      <h6 class="panel-title">Lịch hẹn của bạn</h6>
    </div>
    <table class="table table-hover" id="dev-table">
      <thead>
        <tr>
          <th>Tên Bác sĩ</th>
          <th>Mô tả</th>
          <th>Ngày</th>
          <th>Trạng thái</th>
        </tr>
      </thead>
      {% for a in appointments %}
      <tr>
        <td> {{a.doctorName}}</td>
        <td>{{a.description}}</td>
        <td>{{a.appointmentDate}}</td>
        {%if a.status%}
        <td> <span class="label label-primary">Đã xác nhận</span></td>
        {% else %}
        <td> <span class="label label-success">Chờ duyệt</span></td>
        {% endif %}
      </tr>
      {% endfor %}
    </table>
  </div>
</div>

{% endblock content %}
