# Hospital Management - CI/CD Pipeline
# ====================================
# GitHub Actions workflow for continuous integration and deployment

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ========================================
  # JOB 1: Lint and Code Quality
  # ========================================
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit safety

      - name: Run Ruff (Linter)
        run: ruff check . --output-format=github

      - name: Run Bandit (Security)
        run: bandit -r hospital streamlit_app -f github

  # ========================================
  # JOB 2: Django Backend Tests
  # ========================================
  django-tests:
    name: Django Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        run: pytest hospital/tests.py -v --cov=hospital --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ========================================
  # JOB 3: Streamlit Frontend Tests
  # ========================================
  streamlit-tests:
    name: Streamlit Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pytest pytest-playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run Streamlit tests
        run: |
          # Start Streamlit in background
          streamlit run streamlit_app/main.py &
          sleep 5
          # Run tests
          pytest tests/ -v

  # ========================================
  # JOB 4: Build Docker Images
  # ========================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, django-tests]
    
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Django image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: django-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hospital-django:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Streamlit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: streamlit-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hospital-streamlit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # JOB 5: Deploy to Staging
  # ========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Deploy to Railway
        run: |
          echo "Deploying to staging environment..."
          # Add deployment commands here
          # railway up --environment staging

  # ========================================
  # JOB 6: Deploy to Production
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://hospital.example.com
    
    steps:
      - name: Deploy to Railway
        run: |
          echo "Deploying to production environment..."
          # Add deployment commands here
          # railway up --environment production
